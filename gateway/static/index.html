<!doctype html>

    <section class="grid two-col" id="controlGrid">

        <div class="metric-row">

          <div class="metric"><span class="metric-label">琛ュ厜鐏?/span><strong id="lightState">--</strong></div>
          <div class="metric"><span class="metric-label">鍑鸿揣鍒ゆ柇</span><strong id="shipmentState">--</strong></div>
        </div>
        <div class="control-group">
          <button data-role="auto" data-command='{"node":"ia1","payload":{"action":"set_mode","mode":"auto"}}'>鑷姩妯″紡</button>
          <button data-role="fan-on" data-command='{"node":"ia1","payload":{"action":"fan","value":1}}'>寮€椋庢墖</button>

        <div class="metric-row">
          <div class="metric"><span class="metric-label">鍖哄煙鐘舵€?/span><strong id="zoneState">--</strong></div>
          <div class="metric"><span class="metric-label">閫熷害</span><strong><span id="speed">--</span> m/s</strong></div>
          <div class="metric"><span class="metric-label">铚傞福鍣?/span><strong id="buzzerState">--</strong></div>
        </div>
        <div class="control-group">
          <button class="primary" data-command='{"node":"st1","payload":{"action":"start_transport"}}'>寮€濮嬭繍杈?/button>
          <button data-command='{"node":"st1","payload":{"action":"end_transport"}}'>缁撴潫杩愯緭</button>
          <button data-command='{"node":"st1","payload":{"action":"set_geofence","radius_m":80}}'>閲嶈鐢靛瓙鍥存爮</button>
          <button data-command='{"node":"st1","payload":{"action":"silence"}}'>娑堥煶鎶ヨ</button>

    </section>

    <section class="mode-switch-panel">

          <div class="chart-head"><span>鍏夌収</span><strong id="singleLuxNow">-- lx</strong></div>
          <canvas id="luxChart" width="900" height="230"></canvas>
        </div>
      </div>
      <p id="singleHint" class="hint mode-hint"></p>

    <section id="regionView" class="grid two-col lower-grid hidden-view">
